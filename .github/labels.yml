# Label definitions for lib-service-discovery
# Synced via .github/workflows/routine.yml -> shared labels-sync.

# ── Scopes (aligned with .github/labeler.yml and pr-validation.yml) ───────────

- name: consul
  color: "d62728"
  description: Consul registry backend

- name: core
  color: "1d76db"
  description: Public API — Manager, Registry, resolvers, domain types, config

- name: config
  color: "0e8a16"
  description: Application and tooling configuration

- name: demo
  color: "5319e7"
  description: Demo services and docker-compose

- name: ci
  color: "fbca04"
  description: CI pipelines and automation configs

- name: scripts
  color: "c5def5"
  description: Build and developer scripts, git hooks

- name: deps
  color: "0366d6"
  description: Go module dependencies

- name: docs
  color: "006b75"
  description: Documentation and markdown

- name: security
  color: "b60205"
  description: Security and TLS/ACL handling

- name: tests
  color: "c2e0c6"
  description: Unit and integration tests

# ── Change types ──────────────────────────────────────────────────────────────

- name: bug
  color: "d73a4a"
  description: Something isn't working

- name: enhancement
  color: "a2eeef"
  description: New feature or request

- name: dependencies
  color: "0366d6"
  description: Dependency updates

- name: github-actions
  color: "000000"
  description: GitHub Actions updates

- name: breaking-change
  color: "b60205"
  description: Introduces a breaking change to the public API

- name: skip-changelog
  color: "ededed"
  description: Excluded from the changelog

# ── Size ──────────────────────────────────────────────────────────────────────

- name: size/XS
  color: "3cbf00"
  description: Extra small change

- name: size/S
  color: "5d9801"
  description: Small change

- name: size/M
  color: "7f7203"
  description: Medium change

- name: size/L
  color: "a14c05"
  description: Large change

- name: size/XL
  color: "c32607"
  description: Extra large change

# ── Triage / stale ────────────────────────────────────────────────────────────

- name: triage
  color: "fbca04"
  description: Needs triage

- name: stale
  color: "cccccc"
  description: No recent activity

- name: no-stale
  color: "ffffff"
  description: Exempt from stale automation

- name: work-in-progress
  color: "f9d0c4"
  description: Not ready for review

- name: pinned
  color: "5319e7"
  description: Pinned, exempt from stale automation

- name: review-ready
  color: "0e8a16"
  description: CI passed and a CodeRabbit review was requested

# ── Automation ────────────────────────────────────────────────────────────────

- name: backmerge
  color: "bfdadc"
  description: Automated main -> develop backmerge

- name: automated
  color: "ededed"
  description: Opened by automation
